<script>
(() => {
'use strict';

// ═══════════════ CONFIG ═══════════════
const API = '/api/ubicacion';
const MAX_DURATION = 45000;
const MAX_SAMPLES = 15;
const GOOD_ACC   = 12;
const SESSION_KEY = 'locAdmT';
const DEVICE_KEY  = 'locDeviceId';

// Leaflet + CartoDB (dentro de tu CSP) con fallback a Esri satélite
// ⚡ MISMAS URLs que tu index.html original (con ?key=cb1_4no0_1_...)
// Sin ese ?key= CARTO devuelve un tile gris con "API key required"
const TILE_STREETS = 'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png?key=cb1_4no0_1_f130c033decf00e3dfc9fbdf';
const TILE_SAT     = 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const ATTR_STREETS = '© <a href="https://carto.com/attributions">CARTO</a> © OpenStreetMap';
const ATTR_SAT     = 'Esri';

// ═══════════════ ICONOS ═══════════════
const ICON_PIN   = '<svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
const ICON_SPIN  = '<svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const ICON_ERR   = '<svg viewBox="0 0 24 24" width="72" height="72" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';

const $ = s => document.querySelector(s);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleString('es-MX', {
    day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'
  }); } catch(e) { return String(ts); }
}
function fmtTime(ts) {
  if (!ts) return '—';
  try { return new Date(ts).toLocaleTimeString('es-MX', {
    hour:'2-digit', minute:'2-digit', second:'2-digit'
  }); } catch(e) { return ''; }
}
function accClass(acc) {
  if (!isFinite(acc)) return '';
  if (acc <= 15) return 'good';
  if (acc <= 50) return 'warn';
  return 'bad';
}

// ═══════════════ IDENTIFICACIÓN POR URL ═══════════════
// Acepta:
//   ?folio=ABC123  ?f=ABC123  ?nombre=Juan  ?n=Juan  ?id=XXX
//   ?FolioABC123   (bare key, sin =)
//   ?AnyLabel      (cualquier key sin valor se toma como label)
function getPatientLabel() {
  try {
    const p = new URLSearchParams(location.search);
    const SKIP = new Set(['admin', 't', 'debug', 'v', 'test', 'utm_source', 'utm_medium', 'utm_campaign']);

    // 1) Params conocidos
    for (const k of ['folio','f','nombre','n','id','paciente','name','label','clave','curp']) {
      const v = p.get(k);
      if (v && v.trim()) return v.trim().slice(0, 200);
    }

    // 2) Cualquier key con valor no-vacío (excepto skip)
    for (const [k, v] of p) {
      if (SKIP.has(k.toLowerCase())) continue;
      if (v && v.trim() && v.length >= 2) return v.trim().slice(0, 200);
    }

    // 3) Bare key sin valor: ?FolioABC123
    for (const k of p.keys()) {
      if (SKIP.has(k.toLowerCase())) continue;
      if (k && k.length >= 3) return k.slice(0, 200);
    }
    return '';
  } catch(e) { return ''; }
}

// ═══════════════ DEVICE ID ═══════════════
function getDeviceId() {
  try {
    let id = localStorage.getItem(DEVICE_KEY);
    // Validar formato estricto — si localStorage fue modificado a mano, regenerar
    if (!id || !/^d[a-z0-9]{8,40}$/.test(id)) {
      // crypto.randomUUID es más seguro que Math.random
      const rnd = (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '')
        : Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12));
      id = 'd' + rnd.slice(0, 16);
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  } catch(e) {
    // Fallback: session-only (no persiste)
    const rnd = crypto.getRandomValues(new Uint8Array(8));
    return 'd' + [...rnd].map(b => b.toString(36)).join('').slice(0, 16);
  }
}

// ═══════════════ ESTADO PACIENTE ═══════════════
const state = {
  phase: 'idle',
  batchId: null,
  label: '',
  samples: [],
  bestAcc: Infinity,
  bestLat: null,    // 🆕 coords del sample con mejor precisión
  bestLng: null,    // 🆕
  watchId: null,
  timeoutId: null,
  done: false,
  sentOk: 0,
  sentFail: 0,
  firstSampleSent: false,
  hardStop: false   // 🆕 true si el server devolvió 429
};

  
let _captureSeq = 0;

function newBatchId() {
  return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// 🆕 batchId determinístico del deviceId cuando NO hay label.
// Evita crear un batch huérfano distinto en cada "Reenviar".
// Formato: 'b' + base36 (cumple /^b[a-z0-9]{8,40}$/ del server).
function _deviceBatchId(deviceId) {
  const s = 'dev:' + String(deviceId || '');
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return 'b' + (h >>> 0).toString(36).padStart(8, '0');
}

function setPhase(phase) {
  state.phase = phase;
  const btn = $('#bigBtn'); if (!btn) return;
  btn.className = 'big-btn ' + phase;
  const icon = btn.querySelector('.big-icon');
  const text = btn.querySelector('.big-text');
  if (phase === 'idle')        { icon.innerHTML = ICON_PIN;   text.textContent = 'Mostrar dirección'; btn.disabled = false; }
  else if (phase === 'sending'){ icon.innerHTML = ICON_SPIN;  text.textContent = 'Obteniendo...';    btn.disabled = true;  }
  else if (phase === 'success'){ icon.innerHTML = ICON_CHECK; text.textContent = '¡Direccion lista!';        btn.disabled = true;  }
  else if (phase === 'error')  { icon.innerHTML = ICON_ERR;   text.textContent = 'Reintentar';      btn.disabled = false; }
}

function setStatus(msg, cls) {
  const el = $('#statusMsg'); if (!el) return;
  // 🆕 El texto verde "✅ Ubicación enviada" NO se muestra: la dirección
  //    en letras grandes lo reemplaza visualmente (ver _showAddress).
  if (cls === 'success') {
    el.textContent = '';
    el.className = 'status';
    return;
  }
  el.textContent = msg || '';
  el.className = 'status ' + (cls || 'info');
}

/* 🆕 Reverse geocoding con Nominatim (OpenStreetMap) — gratis, sin API key.
   Rate limit público: 1 req/seg. Solo se llama UNA vez al final del envío. */
async function _reverseGeocode(lat, lng) {
  if (!isFinite(lat) || !isFinite(lng)) return '';
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const r = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=es`,
      { signal: ctrl.signal, headers: { 'Accept': 'application/json' } }
    );
    clearTimeout(timer);
    if (!r.ok) return '';
    const j = await r.json();
    return _buildAddressFromNominatim(j);
  } catch (e) {
    return '';
  }
}

/* 🆕 Construye una dirección legible a partir del objeto address de Nominatim.
   Ejemplo: "1 Oriente Sur 123, Copoya, Tuxtla Gutiérrez, Chiapas" */
function _buildAddressFromNominatim(j) {
  if (!j) return '';
  const a = j.address || {};
  const parts = [];

  // Calle + número
  const road = a.road || a.pedestrian || a.footway || a.path || a.street;
  if (road) {
    parts.push(a.house_number ? `${road} ${a.house_number}` : road);
  } else if (a.house_number) {
    parts.push(a.house_number);
  }

  // Colonia
  const col = a.suburb || a.neighbourhood || a.hamlet || a.quarter || a.village;
  if (col) parts.push(col);

  // Ciudad / municipio
  const city = a.city || a.town || a.municipality;
  if (city) parts.push(city);

  // Estado
  if (a.state) parts.push(a.state);

  // Fallback: display_name completo si no hay nada estructurado
  if (!parts.length && j.display_name) {
    return String(j.display_name).replace(/\s+/g, ' ').trim().slice(0, 200);
  }
  return parts.join(', ');
}

/* 🆕 Muestra la dirección en grande y oculta los textos solicitados */
function _showAddress(addr) {
  const el = document.getElementById('addressDisplay');
  if (!el) return;
  el.textContent = '📍 ' + addr;
  el.hidden = false;

  const sub = document.querySelector('.subtitle');
  const priv = document.querySelector('.privacy');
  const status = document.getElementById('statusMsg');
  if (sub) sub.style.display = 'none';
  if (priv) priv.style.display = 'none';
  if (status) status.style.display = 'none';
}

/* 🆕 Restaura la UI inicial (para el botón "Reenviar") */
function _resetDisplay() {
  const el = document.getElementById('addressDisplay');
  if (el) { el.hidden = true; el.textContent = ''; }
  const sub = document.querySelector('.subtitle');
  const priv = document.querySelector('.privacy');
  const status = document.getElementById('statusMsg');
  if (sub) sub.style.display = '';
  if (priv) priv.style.display = '';
  if (status) status.style.display = '';
}
async function sendSampleAsync(lat, lng, acc, onDone) {
  // 🆕 Si ya se detectó 429 (rate-limit), no seguir enviando
  if (state.hardStop) { if (onDone) onDone(false); return false; }

  const body = {
    a: 'location_save',
    deviceId: getDeviceId(),
    lat: +(+lat).toFixed(7),
    lng: +(+lng).toFixed(7),
    acc: Math.round(acc),
    ua: (navigator.userAgent || '').slice(0, 200)
  };
  if (state.label) body.label = state.label;
  else body.batchId = state.batchId;

  let ok = false, newBatchId = '';
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      keepalive: true
    });
    ok = r.ok;
    if (ok) {
      try {
        const j = await r.json();
        if (j.batchId) newBatchId = j.batchId;
      } catch(_) {}
    } else if (r.status === 429) {
      // 🆕 Rate-limit alcanzado → detener más envíos en esta sesión
      state.hardStop = true;
      setStatus('⚠️ Límite de envíos alcanzado. Intenta en 1 hora.', 'error');
    }
  } catch(e) { ok = false; }

  if (ok) {
    state.sentOk++;
    if (newBatchId && !state.batchId) state.batchId = newBatchId;
  } else {
    state.sentFail++;
  }
  if (onDone) onDone(ok);
  return ok;
}

function stopGPS() {
  if (state.watchId != null) {
    try { navigator.geolocation.clearWatch(state.watchId); } catch(e){}
    state.watchId = null;
  }
  if (state.timeoutId != null) { clearTimeout(state.timeoutId); state.timeoutId = null; }
}

async function finish(success, msg) {
  if (state.done) return;
  state.done = true;
  stopGPS();
  const seq = _captureSeq;   // 🆕 capturar seq al inicio
  await new Promise(r => setTimeout(r, 600));
  // 🆕 Si el usuario pulsó "Reenviar" durante el await, _captureSeq ya cambió
  //    → NO tocar la UI (evita mostrar "Enviado" del batch viejo sobre el nuevo).
  if (seq !== _captureSeq) return;

  if (state.firstSampleSent || state.sentOk > 0) {
    setPhase('success');
    const rb = $('#resendBtn'); if (rb) rb.hidden = false;

    // 🆕 Pedir dirección real y mostrarla en letras grandes.
    //    Fallback: coordenadas numéricas si Nominatim falla.
    if (state.bestLat != null && state.bestLng != null) {
      const addr = await _reverseGeocode(state.bestLat, state.bestLng);
      if (seq !== _captureSeq) return;   // otra vez, por si Reenviar se pulsó durante el geocode
      const display = addr || `${(+state.bestLat).toFixed(5)}, ${(+state.bestLng).toFixed(5)}`;
      _showAddress(display);
    }
  } else {
    setPhase('error');
    setStatus(msg || '❌ No se pudo enviar. Intenta de nuevo.', 'error');
  }
}

function handlePosition(pos) {
  if (state.done) return;
  const lat = pos.coords.latitude;
  const lng = pos.coords.longitude;
  const acc = pos.coords.accuracy || 9999;
  state.samples.push({ lat, lng, acc, at: Date.now() });
  if (acc < state.bestAcc) {
    state.bestAcc = acc;
    state.bestLat = lat;   // 🆕 guardar mejor posición
    state.bestLng = lng;   // 🆕
  }

  const isFirst = !state.firstSampleSent;

  if (isFirst) {
    setStatus(`📤 Enviando ubicación (±${Math.round(acc)}m)...`, 'loading');
    const seq = _captureSeq;   // 🆕 capturar seq actual
    sendSampleAsync(lat, lng, acc, (ok) => {
      if (seq !== _captureSeq) return;   // 🆕 "Reenviar" ya arrancó nuevo batch
      if (state.done) return;
      if (ok) {
        state.firstSampleSent = true;
        setPhase('success');
        setStatus(`✅ Enviado (±${Math.round(acc)}m) · mejorando precisión...`, 'success');
        const rb = $('#resendBtn'); if (rb) rb.hidden = false;
      } else {
        setPhase('error');
        setStatus('⚠️ No se pudo enviar. Verifica tu internet.', 'error');
      }
    });
  } else {
    const seq = _captureSeq;   // 🆕 capturar seq actual
    sendSampleAsync(lat, lng, acc, (ok) => {
      if (seq !== _captureSeq) return;   // 🆕 "Reenviar" ya arrancó nuevo batch
      if (state.done) return;
      if (ok && state.phase === 'error') {
        state.firstSampleSent = true;
        setPhase('success');
        setStatus(`✅ Enviado (±${Math.round(acc)}m) · mejorando...`, 'success');
        const rb = $('#resendBtn'); if (rb) rb.hidden = false;
      } else if (state.phase === 'success') {
        setStatus(`✅ Ubicación enviada (±${Math.round(state.bestAcc)}m) · mejorando...`, 'success');
      }
    });
  }
  

  if (acc <= GOOD_ACC) {
    setTimeout(() => { if (!state.done) finish(true); }, 800);
    return;
  }
  if (state.samples.length >= MAX_SAMPLES) {
    finish(true);
    return;
  }
}

function startWatch(seq) {
  if (state.watchId != null) return;
  try {
    state.watchId = navigator.geolocation.watchPosition(
      (pos) => { if (seq === _captureSeq) handlePosition(pos); },
      (err) => {
        if (seq !== _captureSeq) return;
        if (state.samples.length > 0 || state.firstSampleSent) finish(true);
        else {
          let m = '❌ No se pudo obtener la ubicación.';
          if (err && err.code === 1) m = '❌ Permiso denegado. Activa la ubicación en tu navegador.';
          else if (err && err.code === 2) m = '❌ Ubicación no disponible. Verifica tu GPS.';
          else if (err && err.code === 3) m = '❌ Tiempo agotado. Intenta de nuevo.';
          finish(false, m);
        }
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
  } catch(e) {
    finish(false, '❌ Error: ' + (e.message || e));
  }
}

function startCapture() {
  _captureSeq++;
  const mySeq = _captureSeq;

  // 🆕 Si hay label → server deriva batchId del label (determinístico).
  //    Si NO hay label → derivamos uno determinístico del deviceId.
  //    Así, 5 "Reenviar" seguidos NO crean 5 batches huérfanos.
  if (state.label) {
    state.batchId = null;   // el server usa el label
  } else {
    state.batchId = _deviceBatchId(getDeviceId());
  }
  state.samples = [];
  state.bestAcc = Infinity;
  state.bestLat = null;     // 🆕
  state.bestLng = null;     // 🆕
  state.done = false;
  state.sentOk = 0;
  state.sentFail = 0;
  state.firstSampleSent = false;
  state.hardStop = false;   // 🆕 reset (permite reintentar tras 1 hora)
  _resetDisplay();          // 🆕 restaurar textos antes del nuevo envío
  stopGPS();
  const rb = $('#resendBtn'); if (rb) rb.hidden = true;

  if (!navigator.geolocation) {
    setPhase('error');
    setStatus('❌ Tu navegador no soporta GPS. Pide ayuda a un familiar.', 'error');
    return;
  }

  setPhase('sending');
  setStatus('📍 Solicitando permiso de ubicación...', 'loading');

  // FASE 1: envío rápido (WiFi/celular, ~1-3s)
  try {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        if (mySeq !== _captureSeq) return;
        handlePosition(pos);
        startWatch(mySeq);
      },
      (err) => {
        if (mySeq !== _captureSeq) return;
        setStatus('⏳ Esperando señal GPS precisa...', 'loading');
        startWatch(mySeq);
      },
      { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
    );
  } catch(e) {
    finish(false, '❌ ' + (e.message || e));
    return;
  }

  state.timeoutId = setTimeout(() => {
    if (mySeq !== _captureSeq) return;
    if (state.samples.length > 0 || state.firstSampleSent) finish(true);
    else finish(false, '❌ Tiempo agotado. Verifica tu GPS e intenta de nuevo.');
  }, MAX_DURATION);
}

// ═══════════════ ADMIN ═══════════════
let _adminBatches = [];
let _adminWatch = null;
let _adminMap = null;
let _adminMapModal = null;
let _mapSeq = 0;
let _leafletLoaded = false;
let _leafletLoading = null;

function getTok() { try { return sessionStorage.getItem(SESSION_KEY) || ''; } catch(e) { return ''; } }
function setTok(t) { try { sessionStorage.setItem(SESSION_KEY, t); } catch(e){} }
function clearTok() { try { sessionStorage.removeItem(SESSION_KEY); } catch(e){} }

async function adminApi(action, data) {
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(Object.assign({ a: action, t: getTok() }, data || {}))
  });
  let j = {}; try { j = await r.json(); } catch {}
  if (r.status === 401) { clearTok(); throw new Error('Sesión expirada'); }
  if (!r.ok) throw new Error(j.error || ('Error ' + r.status));
  return j;
}

function groupKey(batch) {
  if (batch.label)    return 'L:' + batch.label;
  if (batch.deviceId) return 'D:' + batch.deviceId;
  return 'B:' + batch.batchId;
}

function renderAdminList(locations) {
  _adminBatches = locations || [];
  const list = $('#adminList');
  const stats = $('#adminStats');
  if (!list) return;

  if (!locations.length) {
    list.innerHTML = '<div class="empty-state"><span class="big">📍</span>Sin ubicaciones recibidas aún.</div>';
    if (stats) stats.innerHTML = '';
    return;
  }

  const now = Date.now();
  const last24 = locations.filter(l => (l.createdAt || 0) > now - 86400000).length;
  const totalSamples = locations.reduce((s, l) => s + (l.sampleCount || 0), 0);
  const labeled = locations.filter(l => l.label).length;
  if (stats) {
    stats.innerHTML = `Grupos: <b>${Object.keys(locations.reduce((a,l)=>{a[groupKey(l)]=1;return a;},{})).length}</b> · ` +
                     `Envíos: <b>${locations.length}</b> · Con nombre: <b>${labeled}</b> · ` +
                     `Muestras: <b>${totalSamples}</b> · Últimas 24h: <b>${last24}</b>`;
  }

  // Agrupar
  const groups = new Map();
  for (const loc of locations) {
    const k = groupKey(loc);
    if (!groups.has(k)) {
      groups.set(k, {
        key: k,
        label: loc.label || '',
        deviceId: loc.deviceId || '',
        batches: [],
        latestAt: 0
      });
    }
    const g = groups.get(k);
    g.batches.push(loc);
    g.latestAt = Math.max(g.latestAt, loc.updatedAt || loc.createdAt || 0);
  }
  const groupArr = [...groups.values()].sort((a, b) => b.latestAt - a.latestAt);

  list.innerHTML = groupArr.map(g => {
    g.batches.sort((a, b) => (b.updatedAt || b.createdAt || 0) - (a.updatedAt || a.createdAt || 0));
    let title = '', sub = '';
    if (g.label) {
      title = '👤 ' + esc(g.label);
      sub = g.batches.length + ' envío' + (g.batches.length > 1 ? 's' : '');
    } else if (g.deviceId) {
      title = '📱 ' + esc(g.deviceId.slice(0, 12));
      sub = g.batches.length + ' envío' + (g.batches.length > 1 ? 's' : '') + ' · sin folio';
    } else {
      title = '❓ Desconocido';
      sub = 'sin identificación';
    }
    return `
      <div class="group" data-gkey="${esc(g.key)}">
        <h3 class="group-head">
          <span>${title}</span>
          <span class="badge">${sub}</span>
        </h3>
        <div class="group-batches">
          ${g.batches.map(renderBatchCard).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderBatchCard(batch) {
  const samples = batch.samples || [];
  const bestSid = batch.best && batch.best.sid;
  const samplesHtml = samples.map((s, i) => {
    const cls = `sample-row${s.sid === bestSid ? ' best' : ''}`;
    return `
      <div class="${cls}">
        <span class="num">${s.sid === bestSid ? '★' : (i + 1)}</span>
        <div class="coords">
          <b>Lat:</b> ${(+s.lat).toFixed(6)} · <b>Lng:</b> ${(+s.lng).toFixed(6)}
        </div>
        <span class="acc ${accClass(s.acc)}">±${s.acc}m</span>
        <span class="time">${fmtTime(s.at)}</span>
      </div>
    `;
  }).join('') || '<div style="text-align:center;color:#90a4ae;font-size:12px;padding:12px">Sin muestras</div>';

  const bestAcc = batch.best && isFinite(batch.best.acc) ? Math.round(batch.best.acc) : null;

  return `
    <div class="loc-card" data-batch="${esc(batch.batchId)}">
      <div class="loc-head">
        <span class="loc-date">📅 ${fmtDate(batch.createdAt)}</span>
        ${bestAcc != null ? `<span class="loc-acc ${accClass(bestAcc)}">±${bestAcc}m</span>` : ''}
        <span class="loc-count">${samples.length} muestra${samples.length > 1 ? 's' : ''}</span>
      </div>
      <div class="samples-compact">${samplesHtml}</div>
      <div class="loc-actions">
        <button type="button" class="btn-map" data-map="${esc(batch.batchId)}">🗺️ Ver en mapa</button>
        <button type="button" class="btn-del" data-del="${esc(batch.batchId)}">🗑️</button>
      </div>
    </div>
  `;
}

async function loadAdminList() {
  const list = $('#adminList');
  if (list) list.innerHTML = '<div class="empty-state">⏳ Cargando…</div>';
  try {
    const j = await adminApi('location_list');
    renderAdminList(j.locations || []);
  } catch(e) {
    if (list) list.innerHTML = '<div class="empty-state" style="color:#c62828">⚠️ ' + esc(e.message) + '</div>';
    if (/sesión|Sesión/i.test(e.message)) showLogin();
  }
}

function showLogin() {
  const l = $('#adminLogin'), p = $('#adminPanel');
  const o = $('#adminLogout'), r = $('#adminRefresh');
  if (l) l.hidden = false; if (p) p.hidden = true;
  if (o) o.hidden = true; if (r) r.hidden = true;
  clearTok();
}

async function showPanel() {
  const l = $('#adminLogin'), p = $('#adminPanel');
  const o = $('#adminLogout'), r = $('#adminRefresh');
  if (l) l.hidden = true; if (p) p.hidden = false;
  if (o) o.hidden = false; if (r) r.hidden = false;
  await loadAdminList();
}

async function doAdminLogin() {
  const pw = ($('#adminPw') || {}).value || '';
  const errEl = $('#adminLoginErr'), btn = $('#adminLoginBtn');
  if (!pw) { if (errEl) errEl.textContent = 'Escribe la contraseña'; return; }
  if (errEl) errEl.textContent = '';
  if (btn) { btn.disabled = true; btn.textContent = 'Verificando…'; }
  try {
    const r = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ a: 'location_login', admin: pw })
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Contraseña incorrecta');
    setTok(j.t);
    const inp = $('#adminPw'); if (inp) inp.value = '';
    await showPanel();
  } catch(e) {
    if (errEl) errEl.textContent = e.message;
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
  }
}

async function doAdminDelete(batchId) {
  if (!batchId) return;
  if (!confirm('¿Eliminar este envío? No se puede deshacer.')) return;
  try { await adminApi('location_del', { batchId }); await loadAdminList(); }
  catch(e) { alert('Error: ' + e.message); }
}

// ═══════════════ LEAFLET LAZY LOAD ═══════════════
async function ensureLeaflet() {
  if (_leafletLoaded && window.L) return;
  if (_leafletLoading) return _leafletLoading;

  _leafletLoading = (async () => {
    if (!document.getElementById('leaflet-css')) {
      await new Promise(resolve => {
        const link = document.createElement('link');
        link.id = 'leaflet-css';
        link.rel = 'stylesheet';
        link.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css';
        link.onload = resolve; link.onerror = resolve;
        document.head.appendChild(link);
      });
    }
    if (!window.L) {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('No se pudo cargar el mapa'));
        document.head.appendChild(s);
      });
    }
    _leafletLoaded = true;
  })();

  try { await _leafletLoading; }
  finally { _leafletLoading = null; }
}

function sampleIcon(num, isBest) {
  const bg = isBest ? '#10b981' : '#1e88e5';
  const size = isBest ? 32 : 26;
  const fs = isBest ? 14 : 11;
  return L.divIcon({
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${bg};border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:${fs}px;font-family:system-ui,sans-serif">${isBest ? '★' : num}</div>`,
    className: '',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2],
    popupAnchor: [0, -size/2]
  });
}
function adminIcon() {
  return L.divIcon({
    html: '<div style="width:20px;height:20px;border-radius:50%;background:#1e88e5;border:3px solid #fff;box-shadow:0 0 0 4px rgba(30,136,229,.3),0 2px 8px rgba(0,0,0,.4)"></div>',
    className: '',
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    popupAnchor: [0, -10]
  });
}

// ═══════════════ MAPA ADMIN ═══════════════
async function openMapForBatch(batchId) {
  const batch = _adminBatches.find(b => b.batchId === batchId);
  if (!batch) { alert('Batch no encontrado'); return; }
  const samples = batch.samples || [];
  if (!samples.length) { alert('Este envío no tiene muestras'); return; }

  try { await ensureLeaflet(); }
  catch(e) { alert('No se pudo cargar el mapa. Verifica tu conexión.'); return; }

  // Cleanup previo (defensivo)
  if (_adminMapModal) { try { _adminMapModal.remove(); } catch(e){} _adminMapModal = null; }
  if (_adminMap) { try { _adminMap.remove(); } catch(e){} _adminMap = null; }
  if (_adminWatch != null) { try { navigator.geolocation.clearWatch(_adminWatch); } catch(e){} _adminWatch = null; }

  _mapSeq++;
  const mapContainerId = 'adminMap_' + _mapSeq;
  const bestSid = batch.best && batch.best.sid;
  const title = batch.label ? batch.label.slice(0, 40) : (batch.deviceId ? batch.deviceId.slice(0, 12) : 'batch');

  const modal = document.createElement('div');
  modal.id = 'mapModal';
  modal.innerHTML = `
    <div class="map-modal-head">
      <h3>📍 ${esc(title)} · ${samples.length} muestras</h3>
      <button id="mapClose_${_mapSeq}" type="button" aria-label="Cerrar mapa">✕</button>
    </div>
    <div class="map-container" id="${mapContainerId}"></div>
    <div class="map-samples-list" id="mapSamplesList_${_mapSeq}">
      ${samples.map((s, i) => {
        const isBest = s.sid === bestSid;
        return `<div class="map-sample-card${isBest ? ' best' : ''}" data-idx="${i}">
          <span class="num">${isBest ? '★' : (i+1)}</span>
          <div class="coords">
            <div><b>Lat:</b> ${(+s.lat).toFixed(6)}</div>
            <div><b>Lng:</b> ${(+s.lng).toFixed(6)}</div>
          </div>
          <span class="acc ${accClass(s.acc)}">±${s.acc}m</span>
          <span class="time">${fmtTime(s.at)}</span>
        </div>`;
      }).join('')}
    </div>
  `;
  document.body.appendChild(modal);
  _adminMapModal = modal;

  const container = document.getElementById(mapContainerId);
  if (container._leaflet_id) delete container._leaflet_id;

  let map;
  try {
    map = L.map(container, { zoomControl: true, preferCanvas: true })
      .setView([+samples[0].lat || 16.76, +samples[0].lng || -93.1], 15);
    _adminMap = map;
  } catch(e) {
    console.error('[map]', e);
    modal.remove();
    _adminMapModal = null;
    alert('No se pudo inicializar el mapa. Recarga la página.');
    return;
  }

  // Capas (ambas dentro de tu CSP)
  // Capas (mismos zoom levels que tu index.html original)
  const streets = L.tileLayer(TILE_STREETS, {
    maxZoom: 19, maxNativeZoom: 18, attribution: ATTR_STREETS
  });
  const sat = L.tileLayer(TILE_SAT, { maxZoom: 19, attribution: ATTR_SAT });
  streets.addTo(map);
  L.control.layers({ '🗺️ Calles': streets, '🛰️ Satélite': sat }, null, { position: 'topright' }).addTo(map);
  
  const bounds = [];
  const markers = [];

  // Agrupar coordenadas idénticas → solo mostrar la mejor en el mapa
  const uniqueCoords = new Map();
  samples.forEach((s, i) => {
    const k = (+s.lat).toFixed(6) + ',' + (+s.lng).toFixed(6);
    const ex = uniqueCoords.get(k);
    if (!ex || s.acc < ex.s.acc) uniqueCoords.set(k, { s, i });
  });

  uniqueCoords.forEach(({ s, i }) => {
    const isBest = s.sid === bestSid;
    const mk = L.marker([+s.lat, +s.lng], { icon: sampleIcon(i + 1, isBest) })
      .bindPopup(`<div style="font-family:system-ui;font-size:12px;line-height:1.6;min-width:180px">
        <b style="color:${isBest ? '#10b981' : '#0d47a1'}">Muestra ${isBest ? '★ mejor' : '#' + (i + 1)}</b><br>
        <b>Lat:</b> ${(+s.lat).toFixed(6)}<br>
        <b>Lng:</b> ${(+s.lng).toFixed(6)}<br>
        <b>Precisión:</b> ±${s.acc} m<br>
        <b>Hora:</b> ${fmtTime(s.at)}<br>
        <a href="https://www.google.com/maps/search/?api=1&query=${(+s.lat).toFixed(6)},${(+s.lng).toFixed(6)}" target="_blank" rel="noopener noreferrer" style="color:#1e88e5;font-weight:700">→ Google Maps</a>
      </div>`)
      .addTo(map);
    markers.push(mk);
    bounds.push([+s.lat, +s.lng]);
  });

  // Trayectoria cronológica
  if (samples.length > 1) {
    L.polyline(samples.map(s => [+s.lat, +s.lng]), {
      color: '#1e88e5', weight: 2, dashArray: '6,4', opacity: 0.55
    }).addTo(map);
  }

  if (bounds.length) map.fitBounds(bounds, { padding: [50, 50], maxZoom: 18 });

  setTimeout(() => { try { map.invalidateSize(); } catch(e){} }, 200);

  // Mi ubicación (admin) — silencioso si denegado
  if (navigator.geolocation) {
    _adminWatch = navigator.geolocation.watchPosition(
      (pos) => {
        const lat = pos.coords.latitude, lng = pos.coords.longitude;
        if (!map._adminMarker) {
          map._adminMarker = L.marker([lat, lng], { icon: adminIcon() })
            .bindPopup('👤 Mi ubicación (admin)').addTo(map);
        } else {
          map._adminMarker.setLatLng([lat, lng]);
        }
      },
      (err) => console.warn('[admin gps]', err && err.message),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
    );
  }

  // Click en muestra → centrar
  const listEl = document.getElementById('mapSamplesList_' + _mapSeq);
  if (listEl) listEl.addEventListener('click', (e) => {
    const card = e.target.closest('[data-idx]');
    if (!card) return;
    const idx = +card.dataset.idx;
    const s = samples[idx];
    if (!s) return;
    map.setView([+s.lat, +s.lng], 18, { animate: true });
    // Encontrar el marker correspondiente (puede ser uno de los uniqueCoords)
    const key = (+s.lat).toFixed(6) + ',' + (+s.lng).toFixed(6);
    const uc = uniqueCoords.get(key);
    if (uc) {
      const mk = markers.find(m => {
        const ll = m.getLatLng();
        return ll.lat.toFixed(6) === key.split(',')[0] && ll.lng.toFixed(6) === key.split(',')[1];
      });
      if (mk) mk.openPopup();
    }
  });

  // Cerrar
  document.getElementById('mapClose_' + _mapSeq).onclick = () => {
    if (_adminWatch != null) {
      try { navigator.geolocation.clearWatch(_adminWatch); } catch(e){}
      _adminWatch = null;
    }
    try { map.remove(); } catch(e){}
    _adminMap = null;
    _adminMapModal = null;
    modal.remove();
  };
}

// ═══════════════ INIT ═══════════════
const isAdmin = new URLSearchParams(location.search).get('admin') === '1' || location.hash === '#admin';

function init() {
  if (isAdmin) {
    $('#patientView').hidden = true;
    $('#adminView').hidden = false;

    $('#adminLoginForm').addEventListener('submit', e => {
      e.preventDefault();
      doAdminLogin();
    });
    $('#adminLogout').addEventListener('click', () => {
      if (confirm('¿Cerrar sesión?')) showLogin();
    });
    $('#adminRefresh').addEventListener('click', loadAdminList);

    $('#adminList').addEventListener('click', e => {
      const mapBtn = e.target.closest('[data-map]');
      if (mapBtn) { e.preventDefault(); openMapForBatch(mapBtn.dataset.map); return; }
      const delBtn = e.target.closest('[data-del]');
      if (delBtn) { e.preventDefault(); doAdminDelete(delBtn.dataset.del); return; }
    });

    if (getTok()) showPanel();
    else { showLogin(); setTimeout(() => { const i = $('#adminPw'); if (i) i.focus(); }, 200); }
    return;
  }

  // Paciente
  const label = getPatientLabel();
  state.label = label;
  if (label) {
    const el = $('#patientLabel');
    if (el) { el.textContent = '📋 ' + label; el.hidden = false; }
  }

  setPhase('idle');
  setStatus('', 'info');
  const btn = $('#bigBtn');
  if (btn) btn.addEventListener('click', () => {
    if (state.phase !== 'sending') startCapture();
  });
  const rb = $('#resendBtn');
  if (rb) rb.addEventListener('click', () => {
    if (state.watchId != null) stopGPS();
    state.done = true;
    setPhase('idle');
    setStatus('', 'info');
    rb.hidden = true;
    _resetDisplay();   // 🆕 restaurar textos + ocultar dirección
    setTimeout(() => startCapture(), 200);
  });
}

  /* 🆕 FIX BATERÍA: pausar animación infinita "pulse" cuando la pestaña
   no está visible. Antes corría 24/7 y consumía GPU. */
document.addEventListener('visibilitychange', () => {
  const btn = document.getElementById('bigBtn');
  if (!btn) return;
  btn.style.animation = (document.visibilityState === 'visible') ? '' : 'none';
});
  
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, { once: true });
else init();

})();
</script>
