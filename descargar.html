<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargar App - Salon Copoya</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-download {
            display: inline-block;
            background-color: #007bff; /* Puedes cambiar este color por el de tu marca */
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            transition: background-color 0.3s, transform 0.1s;
            box-shadow: 0 4px 15px rgba(0,123,255,0.3);
        }
        .btn-download:hover {
            background-color: #0056b3;
        }
        .btn-download:active {
            transform: scale(0.95);
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🤖</div>
        <h1>App Oficial</h1>
        <p>Descarga nuestra aplicación para Android y accede de forma más rápida y cómoda.</p>
        
        <!-- AQUI VA TU ENLACE AL APK -->
        <a href="./app-debug.apk" class="btn-download" download>Descargar APK</a>
        
        <p style="margin-top: 20px; font-size: 12px; color: #999;">
            * Si tu teléfono te avisa que es un archivo no seguro, es normal (es porque no está en Play Store). Solo dale a "Instalar de todas formas".
        </p>
    </div>

</body>
</html>
