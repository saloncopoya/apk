  <style>
:root{
  --green:#0d3333; --green-2:#164242;
  --cream:#faf6f0; --cream-2:#f3ece1; --card:#ffffff;
  --burgundy:#8B2942; --burgundy-d:#6e1e33;
  --chip:#f7dcd5; --chip-tx:#7a1f33; --chip-on:#8B2942;
  --text:#2b2b2b; --muted:#8a8072;
  --border:#e8dfd3; --border-2:#d8cdbd;
  --ok:#3f8f5b; --warn:#e08a2c; --err:#c0392b;
  --r:14px; --r-sm:10px; --r-pill:999px;
  --sh:0 4px 14px rgba(45,35,25,.07);
  --sh-md:0 8px 24px rgba(45,35,25,.10);
  --sh-lg:0 16px 44px rgba(45,35,25,.18);
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--cream);color:var(--text);min-height:100dvh;overflow-x:hidden;
  padding-bottom:calc(66px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--burgundy);text-decoration:none}
img{max-width:100%}

/* HEADER */
.top{background:var(--green);color:#fff;display:flex;align-items:center;gap:10px;
  padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));
  min-height:56px;position:relative;z-index:25}
.top .menu{background:none;border:0;color:#fff;font-size:22px;padding:6px 8px;border-radius:8px}
.top .menu:active{background:rgba(255,255,255,.15)}
.top .brand{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.top .brand .logo{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.top .brand .txt{min-width:0}
.top .brand .txt b{display:block;font-size:14px;font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand .txt small{display:block;font-size:11px;opacity:.75;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .head-actions{display:flex;gap:6px;align-items:center}
.top .head-actions button{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  color:#fff;width:38px;height:38px;border-radius:10px;display:inline-flex;
  align-items:center;justify-content:center;font-size:17px}
.top .head-actions button:active{background:rgba(255,255,255,.24)}
    /* 🆕 Badge del botón filtros (no reemplaza el SVG) */

    /* 🆕 Badge del botón filtros inferior (mismo look que el superior) */
#fbBot{position:relative}
#fbBot .ic{position:relative;display:inline-block}
#fbBot .fbdg{position:absolute;top:-4px;right:-8px;
  background:#e8b45a;color:#0d3333;border-radius:999px;
  font-size:9px;font-weight:900;padding:1px 5px;min-width:14px;
  text-align:center;line-height:1.3;pointer-events:none;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
    
#fbTop{position:relative}
#fbTop .fbdg{position:absolute;top:-3px;right:-3px;
  background:#e8b45a;color:#0d3333;border-radius:999px;
  font-size:9px;font-weight:900;padding:1px 5px;min-width:14px;
  text-align:center;line-height:1.3;pointer-events:none;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}

/* 🆕 Botón Modo Ahorro (cabecera) */
#btnSaving.on {
  background: #16a34a !important;
  border-color: #16a34a !important;
  color: #fff !important;
  box-shadow: 0 4px 14px rgba(22,163,74,.45) !important;
}
#btnSaving.on:active {
  background: #15803d !important;
}

/* 🆕 Icono WiFi: normal sin slash por defecto, con slash cuando .on */
#btnSaving .wifi-off { display: none; }
#btnSaving.on .wifi-on  { display: none; }
#btnSaving.on .wifi-off { display: inline-block; }

/* 🆕 Placeholder de fotos en modo ahorro */
.photo-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: var(--cream-2);
  color: var(--muted);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .3px;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.2;
  padding: 4px;
  user-select: none;
}
.photo-placeholder .ph-ic {
  font-size: 26px;
  line-height: 1;
  opacity: .55;
}

/* 🆕 Badge del botón Programados (cuenta pacientes programados HOY) */
#navProg { position: relative; }
#navProg .ic { position: relative; display: inline-block; }
#navProg .progdg {
  position: absolute;
  top: -4px;
  right: -8px;
  background: #1e88e5;              /* azul = mismo color que avatar prog-today */
  color: #fff;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 900;
  padding: 1px 5px;
  min-width: 14px;
  text-align: center;
  line-height: 1.3;
  pointer-events: none;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
}

/* TABS */
.tabs{background:var(--green);display:flex;position:relative;z-index:25;
  box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tabs button{flex:1;padding:12px 10px;color:rgba(255,255,255,.7);font-weight:600;
  font-size:13px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-color:#e8b45a}
.tabs button .cnt{background:rgba(255,255,255,.22);border-radius:999px;font-size:10px;
  padding:1px 7px;margin-left:6px;font-weight:700}

.wrap{padding:12px 12px 24px;max-width:900px;margin:0 auto}
.page-title{font-size:20px;font-weight:800;text-align:center;color:var(--text);
  margin:6px 0 14px;letter-spacing:.2px}
.page-sub{display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:10px;font-size:13px;color:var(--muted)}
.page-sub .fi-btn{background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-pill);padding:6px 12px;font-size:12.5px;font-weight:700;
  color:var(--burgundy);display:inline-flex;align-items:center;gap:6px}
.page-sub .fi-btn .bdg{background:var(--burgundy);color:#fff;border-radius:999px;
  padding:0 6px;font-size:10px;font-weight:800;margin-left:2px}

.searchbar{position:relative;margin-bottom:12px}
.searchbar input{width:100%;padding:13px 48px 13px 44px;border-radius:var(--r-pill);
  border:1px solid var(--border);background:var(--card);font-size:14.5px;
  box-shadow:var(--sh);outline:none;transition:.15s}
.searchbar input:focus{border-color:var(--burgundy);box-shadow:0 0 0 4px rgba(139,41,66,.10)}
.searchbar::before{content:"🔍";position:absolute;left:16px;top:50%;transform:translateY(-50%);
  font-size:16px;opacity:.55;pointer-events:none}
/* 🆕 Botón limpiar búsqueda (aparece solo cuando hay texto) */
.searchbar .clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:50%;border:0;background:var(--cream-2);
  color:var(--muted);display:none;align-items:center;justify-content:center;
  font-size:14px;cursor:pointer;font-weight:800;line-height:1;padding:0}
.searchbar .clear-btn:active{background:var(--chip);color:var(--burgundy)}
.searchbar input:not(:placeholder-shown) ~ .clear-btn{display:inline-flex}
    

.cards{display:flex;flex-direction:column;gap:12px}
/* ---------- TARJETA DE PACIENTE ---------- */
.pc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--sh);display:flex;overflow:hidden;position:relative;
  container-type:inline-size}
.pc:active{transform:scale(.995);box-shadow:var(--sh-md)}
.pc .rail{width:9px;background:var(--burgundy);flex:0 0 9px}
.pc.est-1 .rail{background:#ef5350}
.pc.est-2 .rail{background:#4caf50}
.pc.est-3 .rail{background:#78909c}
.pc.est-4 .rail{background:#9ccc65}
.pc.est-5 .rail{background:#8d6e63}
.pc.est-6 .rail{background:#ab47bc}
.pc.est-7 .rail{background:#ffa726}
.pc.est-8 .rail{background:#bdbdbd}
.pc.est-9 .rail{background:#42a5f5}

/* Columna central con todo el contenido */
.pc .main{flex:1;min-width:0;padding:10px 8px 10px 12px;
  display:flex;flex-direction:column;gap:6px}

/* Header: círculo grande + nombre + estatus */
.pc .header{display:flex;align-items:center;gap:10px}
    
.pc .avatar{
  width:46px;height:46px;border-radius:50%;
  background:var(--chip);color:var(--burgundy);
  font-weight:900;font-size:19px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  flex:0 0 46px;border:2px solid var(--cream-2);
  transition:background-color .15s, color .15s, border-color .15s}
/* ✅ Programado HOY → azul */
.pc .avatar.prog-today{
  background:#1e88e5;color:#fff;border-color:#1e88e5}
/* ✅ Programado FUTURO → verde */
.pc .avatar.prog-future{
  background:var(--ok);color:#fff;border-color:var(--ok)}
/* ✅ Programado PASADO → ámbar */
.pc .avatar.prog-past{
  background:var(--warn);color:#fff;border-color:var(--warn)}

    
.pc .title{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.pc .name{
  font-weight:900;letter-spacing:.2px;color:var(--text);line-height:1.1;
  font-size:clamp(15px, 4.3cqw, 21px);
  overflow-wrap:anywhere;word-break:break-word}
    
.pc .sub{
  font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--muted);
  text-transform:uppercase;line-height:1.25;
  overflow-wrap:anywhere;word-break:break-word}
.pc .sub .est{display:inline-block;color:#fff;border-radius:999px;padding:0 7px;
  font-size:10px;font-weight:800;text-transform:none;margin-left:2px;vertical-align:middle}

/* Info: domicilio / refs / teléfonos */
.pc .info{display:flex;flex-direction:column;gap:3px}
.pc .row{display:flex;align-items:flex-start;gap:4px;font-size:12.5px;
  color:var(--text);line-height:1.35}
.pc .row .ico{display:none}
.pc .row .addr{flex:1;min-width:0;word-break:break-word;font-size:12.5px}
.pc .row .addr .cn{font-style:italic;color:var(--muted)}
.pc .row .refs{flex:1;min-width:0;word-break:break-word;font-size:11.5px;color:var(--muted)}
.pc .row .refs b{color:var(--text);font-weight:600}
.pc .row.tel{flex-wrap:wrap;gap:6px}
.pc .row.tel .t{display:inline-flex;align-items:center;gap:4px;background:var(--cream-2);
  padding:3px 10px;border-radius:var(--r-pill);font-weight:700;font-size:12px;
  border:1px solid var(--border);color:var(--burgundy);cursor:pointer}
.pc .row.tel .t:active{background:var(--chip)}

/* Acciones (columna derecha) */
.pc .actions{display:flex;flex-direction:column;justify-content:center;gap:6px;
  padding:10px 12px 10px 4px;flex:0 0 auto}
.pc .visit-btn{background:var(--burgundy);color:#fff;border-radius:var(--r-pill);
  padding:8px 14px;font-weight:700;
  box-shadow:0 3px 10px rgba(139,41,66,.28);
  display:flex;flex-direction:column;align-items:center;gap:0;
  line-height:1.1;text-align:center;white-space:nowrap}
.pc .visit-btn .v1{font-size:13px;font-weight:800}
.pc .visit-btn .v2{font-size:10px;font-weight:600;opacity:.9;margin-top:2px}
.pc .visit-btn:active{background:var(--burgundy-d);transform:scale(.97)}

    
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .big{font-size:52px;opacity:.35;display:block;margin-bottom:8px}

.bnav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:center;
  padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:31;
  box-shadow:0 -4px 18px rgba(45,35,25,.06)}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 10px;color:var(--muted);font-size:10.5px;font-weight:600;flex:1;min-width:0}
.bnav button .ic{font-size:20px;line-height:1}
.bnav button.on{color:var(--burgundy)}

.ovl{position:fixed;inset:0;background:rgba(10,8,6,.72);
  z-index:80;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}

    .ovl.center{align-items:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--cream);width:100%;max-width:640px;max-height:94dvh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  animation:slideUp .22s cubic-bezier(.2,.8,.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:700px){.sheet{border-radius:20px;max-height:90dvh}}
.sheet .sheet-head{background:var(--burgundy);color:#fff;padding:14px 16px;
  display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.3px}
.sheet .sheet-head .close{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;
  width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;
  justify-content:center;font-size:18px;line-height:1}
.sheet .sheet-body{flex:1;overflow-y:auto;padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
.sheet .sheet-foot{background:#fff;border-top:1px solid var(--border);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:10px}
.sheet .sheet-foot .btn{flex:1;justify-content:center;padding:13px 16px;
  font-size:14.5px;border-radius:var(--r-pill)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--cream-2);color:var(--text);border:1px solid var(--border);
  border-radius:var(--r-pill);padding:10px 16px;font-weight:700;font-size:13.5px}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--burgundy);color:#fff;border-color:var(--burgundy);
  box-shadow:0 4px 14px rgba(139,41,66,.28)}
.btn.p:active{background:var(--burgundy-d)}
.btn.g{background:#fff}

.fgroup{margin-bottom:18px}
.flabel{font-size:11.5px;font-weight:800;color:var(--text);letter-spacing:.3px;
  margin-bottom:8px;display:flex;align-items:center;gap:6px}
.fhint{font-size:11px;color:var(--muted);font-weight:500;margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--chip);color:var(--chip-tx);border-radius:var(--r-pill);
  padding:6px 12px;font-size:12.5px;font-weight:700;border:1.5px solid transparent;
  white-space:nowrap;display:inline-flex;align-items:center;gap:5px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis}
.chip .n{font-size:10.5px;opacity:.7;font-weight:800}
.chip.on{background:var(--chip-on);color:#fff;border-color:var(--chip-on);
  box-shadow:0 3px 10px rgba(139,41,66,.28)}
.chip.ghost{background:transparent;border:1.5px dashed var(--border-2);color:var(--muted)}
.finput,.fselect{width:100%;padding:11px 14px;border-radius:var(--r-sm);
  border:1.5px solid var(--border);background:#fff;font-size:14px;outline:none;transition:.15s}
.finput:focus,.fselect:focus{border-color:var(--burgundy);box-shadow:0 0 0 4px rgba(139,41,66,.10)}
.frow{display:flex;gap:8px;align-items:center}
.frow .finput{flex:1}
.seg{display:flex;gap:0;background:#fff;border:1.5px solid var(--border);
  border-radius:var(--r-pill);padding:3px}
.seg button{flex:1;padding:8px 10px;border-radius:var(--r-pill);font-size:12.5px;
  font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--burgundy);color:#fff}

.sort-row{display:flex;align-items:center;gap:10px;padding:10px 4px;
  border-bottom:1px solid var(--border)}
.sort-row:last-child{border-bottom:0}
.sort-row .chk{width:22px;height:22px;border-radius:6px;border:2px solid var(--border-2);
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;
  color:transparent;background:#fff;flex:0 0 22px;font-weight:800}
.sort-row .chk.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.sort-row .lbl{flex:1;font-size:13.5px;color:var(--text)}
.sort-row .pos{font-size:11px;color:var(--muted);font-weight:700;min-width:20px;text-align:center}
.sort-row .dirbtn{padding:5px 11px;border-radius:var(--r-pill);font-size:11.5px;
  font-weight:800;background:var(--cream-2);color:var(--text);border:1px solid var(--border)}
.sort-row .dirbtn.on{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}

#detail{position:fixed;inset:0;background:var(--cream);z-index:50;display:flex;flex-direction:column}
#detail .top{position:static}
#detail .dt-tabs{background:var(--green);display:flex;overflow-x:auto;position:sticky;
  top:0;z-index:10;-webkit-overflow-scrolling:touch}
#detail .dt-tabs button{flex:0 0 auto;padding:12px 16px;color:rgba(255,255,255,.7);
  font-weight:600;font-size:12.5px;border-bottom:3px solid transparent;white-space:nowrap}
#detail .dt-tabs button.on{color:#fff;border-color:#e8b45a}
#detail .dt-body{flex:1;overflow-y:auto;padding:14px 12px 100px;-webkit-overflow-scrolling:touch}
.dcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
.dcard .head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;gap:8px;background:linear-gradient(180deg,#fff,#fdfaf5);
  font-weight:800;font-size:13.5px;color:var(--text)}
.dcard .head .ic{font-size:17px}
.dcard .head .act{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--burgundy);
  background:var(--chip);padding:4px 10px;border-radius:var(--r-pill)}
.dcard .body{padding:14px 16px}
.dgrid{display:grid;grid-template-columns:1fr;gap:12px 18px}
@media(min-width:520px){.dgrid{grid-template-columns:1fr 1fr}}
.dfield .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px;
  text-transform:uppercase;margin-bottom:4px}
.dfield .val{font-size:14.5px;color:var(--text);line-height:1.4;word-break:break-word;min-height:20px}
.dfield .val.big{font-weight:800;font-size:15.5px}
.dfield.wide{grid-column:1/-1}

    /* --- Mostrar/ocultar elementos según modo lectura/edición --- */
#dtBody:not(.editing) .only-edit { display: none !important; }
#dtBody.editing .only-read { display: none !important; }
    
.dfield textarea,.dfield input,.dfield select{width:100%;padding:9px 12px;border-radius:var(--r-sm);
  border:1.5px solid var(--border);background:#fff;font-size:14px;outline:none;transition:.15s}
.dfield textarea:focus,.dfield input:focus,.dfield select:focus{

  .pc .prog-btn.prog-btn-dual .pb-date,

      <span class="cnt" id="tblCnt">0</span>

      
<button data-a="tbl-cols" id="btnCols"> Columnas</button>
<button data-a="tbl-reset" id="btnResetSort" hidden style="background:#fff;color:var(--burgundy);border:1.5px solid var(--burgundy)"> Eliminar órdenes</button>      
    </div>
    <div class="tbl-scroll" id="tblScroll">
      <table id="tblMain"></table>
    </div>
  </div>

  <div id="progWrap" hidden>

        <div class="prog-head">
      <button data-a="prog-prev" title="Mes anterior">‹</button>
      <button data-a="rep-open" id="btnReporte" title="Enviar reporte a WhatsApp" style="background:#25D366;color:#fff;border-color:#25D366;font-size:11px;font-weight:800;width:auto;flex:0 0 auto;padding:0 10px;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;height:30px;border-radius:8px">📱 Enviar Reporte</button>
      <h2 id="progMonthTitle">—</h2>
      <button data-a="toggle-bdays" id="btnToggleBdays" class="toggle-bday" type="button" title="Mostrar/ocultar cumpleaños del mes" style="width:auto;flex:0 0 auto;padding:0 10px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;height:30px;font-size:11px;font-weight:800">
        Cumpleaños
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M12 6c1.1 0 2-.9 2-2 0-.5-.2-1-.6-1.4L12 1l-1.4 1.6C10.2 3 10 3.5 10 4c0 1.1.9 2 2 2zm6 4h-1V8c0-.6-.4-1-1-1h-3V6h-2v1H8c-.6 0-1 .4-1 1v2H6c-1.1 0-2 .9-2 2v7h16v-7c0-1.1-.9-2-2-2zm-2-1v1H8V9h8zm2 8H6v-5c0 0 0 2 2 2s2-2 2-2 0 2 2 2 2-2 2-2 0 2 2 2 2-2 2-2v5z"/></svg>
      </button>
      <button data-a="prog-next" title="Mes siguiente">›</button>
    </div>
    
    <div class="prog-weekdays">
      <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
    </div>
    <div class="prog-cal" id="progCal"></div>
    <div id="progBirthdays" class="bday-wrap" hidden></div>
    <div id="progCards"></div>
  </div>

  <div id="mapWrap" hidden>
    <div id="map"></div>

    <!-- 🏘️ Toggle del panel de búsqueda catastro -->
    <button id="catToggle" class="cat-toggle" data-a="cat-toggle" title="Buscar en catastro">🔍</button>

    <!-- 🏘️ Panel de búsqueda colapsable (Colonia → Sección → Área → Manzana → No.Ext) -->
    <div id="catPanel" class="cat-panel" hidden>
      <div class="cat-panel-head">
        <span>🏘️ Catastro</span>
        <button data-a="cat-toggle" class="cat-panel-close" type="button">✕</button>
      </div>
      <div class="cat-panel-body">
           <div class="cat-field">
          <label for="catColonia">Colonia</label>
          <input id="catColonia" data-a="cat-colonia" list="dl-cat-colonias-panel" placeholder="Escribe o elige…" autocomplete="off">
          <datalist id="dl-cat-colonias-panel"></datalist>
        </div>
        <div class="cat-field">
          <label for="catSeccion">Sección</label>
          <select id="catSeccion" data-a="cat-seccion"><option value="">Todas</option></select>
        </div>
        <div class="cat-field">
          <label for="catArea">Área</label>
          <select id="catArea" data-a="cat-area"><option value="">Todas</option></select>
        </div>
        <div class="cat-field">
          <label for="catManzana">Manzana</label>
          <select id="catManzana" data-a="cat-manzana"><option value="">Todas</option></select>
        </div>
            <div class="cat-field">
          <label for="catNoExt">No. Exterior</label>
          <input id="catNoExt" data-a="cat-noext" inputmode="numeric" placeholder="Ej. 42" autocomplete="off" list="dl-cat-noext">
          <datalist id="dl-cat-noext"></datalist>
        </div>
        <div class="cat-row">
          <button type="button" class="btn g" data-a="cat-clear" style="flex:1;font-size:12.5px;padding:10px 8px">Limpiar</button>
          <button type="button" class="btn p" data-a="cat-find"  style="flex:1;font-size:12.5px;padding:10px 8px">Buscar</button>
        </div>
        <div class="cat-row" style="margin-top:8px">
          <button type="button" class="btn g" data-a="cat-toggle-view" id="catViewBtn"
                  style="flex:1;font-size:12px;padding:10px 8px">👁️ Todos los pines</button>
        </div>
      </div>
    </div>

        <!-- 🎯 Controles flotantes (bottom-right) -->
    <div class="map-controls">
      <button data-a="myloc" id="btnMyLoc" title="Mi ubicación">
        <span class="mc-ic">📍</span>
        <span class="mc-lbl">GPS</span>
      </button>
      <button data-a="fit" title="Centrar">
        <span class="mc-ic">⤢</span>
        <span class="mc-lbl">CENTRAR</span>
      </button>
      <button data-a="layer" title="Satélite / Calles">
        <span class="mc-ic">🛰️</span>
        <span class="mc-lbl">ESTILO</span>
      </button>
      <button data-a="toggle-inegi" id="btnInegi" title="Mapa INEGI (Manzanas, Secciones)">
        <span class="mc-ic">🇲🇽</span>
        <span class="mc-lbl">INEGI</span>
      </button>
      
      <button data-a="sent-locations-toggle" id="btnSentLoc" title="Mostrar/ocultar ubicaciones enviadas">
        <span class="mc-ic">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </span>
        <span class="mc-lbl">RECIBIDAS</span>
      </button>
      <button data-a="cat-add-manzana" id="btnAddManzana" title="Agregar manzana">
        <span class="mc-ic">➕</span>
        <span class="mc-lbl">MZA.</span>
      </button>
    </div>

    <!-- 🎯 Barra de radio GPS (visible solo cuando "Mi ubicación" está activo) -->
    <div id="radioBar" class="radio-bar" hidden>
      <span class="radio-lbl">Radio:</span>
      <button type="button" class="radio-btn" data-a="cat-radius" data-r="50">50m</button>
      <button type="button" class="radio-btn" data-a="cat-radius" data-r="100">100m</button>
      <button type="button" class="radio-btn" data-a="cat-radius" data-r="200">200m</button>
      <button type="button" class="radio-btn" data-a="cat-radius" data-r="500">500m</button>
    </div>
  </div>

  <nav class="bnav" id="bnavMain">
    <button data-a="nav" data-v="home" class="on"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Inicio</button>
 
    
    <button data-a="nav" data-v="prog" id="navProg"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>Programados</button>

    
    <button data-a="nav" data-v="map"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg></span>Mapa</button>

      <button data-a="nav" data-v="filter" id="fbBot"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg></span>Filtros</button>
    <button data-a="scan"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="8" x2="7" y2="16"/><line x1="10" y1="8" x2="10" y2="16"/><line x1="13" y1="8" x2="13" y2="16"/><line x1="17" y1="8" x2="17" y2="16"/></svg></span>Escanear</button>
  </nav>
</div>

<section id="detail" hidden>
  <header class="top">
    <button class="menu" data-a="back"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></button>

      </div>
    </div>

  <nav class="dt-tabs" id="dtTabs">

    <button data-a="tab" data-t="2">📝 Visitas</button>

  </nav>

  <div class="dt-body" id="dtBody"></div>

   <nav class="bnav" style="position:fixed;bottom:0;left:0;right:0">
    <button data-a="tab-prev"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></span>Anterior</button>
    <button data-a="tab-next"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>Siguiente</button>
    <button data-a="go-home"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>Inicio</button>
    <button data-a="edit" id="pen" title="Editar" style="color:var(--burgundy)"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></span>Editar</button>
    <button data-a="save" id="ok" title="Guardar cambios" hidden style="color:#22a55b"><span class="ic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>Guardar</button>
  </nav>

  
</section>
